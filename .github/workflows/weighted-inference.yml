name: Weighted inference

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/weighted-inference.yml"
      - "sam3_mlx/checkpoint.py"
      - "sam3_mlx/model_builder.py"
      - "sam3_mlx/multiplex_builder.py"
      - "tests/integration/test_weighted_image_inference.py"
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  weighted-image-inference:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      SAM3_MLX_RUN_WEIGHTED_INTEGRATION: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Run pinned real-weight inference contract
        run: uv run pytest -q tests/integration/test_weighted_image_inference.py

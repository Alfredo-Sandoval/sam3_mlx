name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked --group dev

      - name: Check generated upstream contract
        run: uv run python -m sam3_mlx._unsupported --check UPSTREAM.md

      - name: Lint maintained surfaces
        run: |
          uv run ruff check sam3_mlx tests
          uv run ruff check --select F,I,B,UP \
            sam3_mlx/_unsupported.py \
            sam3_mlx/convert.py \
            sam3_mlx/model_builder.py \
            sam3_mlx/multiplex_builder.py \
            sam3_mlx/model/io_utils.py \
            sam3_mlx/model/sam3_base_predictor.py \
            sam3_mlx/model/sam3_multiplex_video_predictor.py \
            sam3_mlx/model/sam3_video_inference.py
          uv run ruff format --check \
            sam3_mlx/_unsupported.py \
            sam3_mlx/convert.py \
            sam3_mlx/model_builder.py \
            sam3_mlx/multiplex_builder.py \
            sam3_mlx/model/io_utils.py \
            sam3_mlx/model/sam3_base_predictor.py \
            sam3_mlx/model/sam3_multiplex_video_predictor.py \
            sam3_mlx/model/sam3_video_inference.py

      - name: Type-check maintained surfaces
        run: uv run pyright

      - name: Run test suite
        run: uv run pytest -q

      - name: Build and verify distributions
        run: |
          uv build
          uv run twine check dist/*

      - name: Verify installed wheel contract
        run: |
          wheel_env="$(mktemp -d)/wheel-env"
          uv venv "$wheel_env" --python 3.13
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          "$wheel_env/bin/python" tools/verify_installed_wheel.py
